name: Publish PWA Delivery Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - manifest.webmanifest
      - sw.js
      - icon-192.png
      - icon-512.png
      - README.txt

permissions:
  contents: read

concurrency:
  group: pwa-delivery-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage only the eight approved test files
        shell: bash
        run: |
          mkdir _site
          cp -- index.html styles.css app.js manifest.webmanifest sw.js icon-192.png icon-512.png README.txt _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
